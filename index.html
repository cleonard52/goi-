<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Getting Over It - JS Clone</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="hud">
    <div class="stat">Height: <span id="height-display">0</span>m / 120m</div>
    <div class="stat">Time: <span id="time-display">00:00</span></div>
    <button id="reset-btn">Restart</button>
  </div>

  <div id="instructions">
    Move <strong>mouse</strong> to aim &amp; extend/retract the hammer. Plant the head on surfaces and <strong>pull</strong>!
  </div>

  <div id="win-screen" class="hidden">
    <h1>You Made It!</h1>
    <p>Final Time: <span id="final-time">00:00</span></p>
    <button id="play-again-btn">Climb Again</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script src="game.js"></script>
</body>
</html>
